[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-ve-admin-docs-mcp"
version = "0.1.0"
description = "MCP server exposing the Proxmox VE Administration Guide"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]

[project.scripts]
proxmox-docs-mcp = "server:main"

[tool.setuptools.packages.find]
where = ["."]
